# Docker 集成测试专用栈 —— 与业务栈完全隔离。
#
# 隔离点：
#   - 独立项目名（modelgate-docker-test），因此容器、网络、数据卷都不与业务栈共享
#   - 独立的 PostgreSQL 容器与数据卷，库名 modelgate_docker_test
#   - API 容器通过 DATABASE_URL 显式指向测试库，不使用 .env 的业务配置
#   - 独立端口（18000 / 15432），不会误连到业务容器
#   - 上游指向一个不可路由的地址：不会访问真实 DeepSeek / OpenAI，
#     也不会产生任何付费调用；请求会确定性地得到 502 并留下一条调用记录，
#     这正好是持久化测试需要的条件
#
# 启动方式（由 tests/test_docker_integration.py 自动完成）：
#   docker compose -p modelgate-docker-test -f docker-compose.test.yml up -d --build

name: modelgate-docker-test

services:
  db:
    image: postgres:16-alpine
    container_name: modelgate-test-db
    environment:
      POSTGRES_USER: modelgate
      POSTGRES_PASSWORD: modelgate
      POSTGRES_DB: postgres
    volumes:
      - test_pgdata:/var/lib/postgresql/data
      # 显式创建测试库，避免 API 容器连到不存在的库
      - ./tests/docker/init-test-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      # 只绑定回环，且用非默认端口，避免与业务库 5432 混淆
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelgate -d modelgate_docker_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modelgate-test-api
    environment:
      # 测试库，库名以 _test 结尾，符合 tests/db_safety.py 的安全约定
      DATABASE_URL: postgresql+asyncpg://modelgate:modelgate@db:5432/modelgate_docker_test
      # 固定密钥，测试自用；与业务栈的密钥无关
      CLIENT_API_KEYS: sk-docker-test-client-key
      ADMIN_API_KEY: sk-docker-test-admin-key
      # 上游指向 RFC 6761 的保留 TLD `.invalid`，DNS 必然解析失败：
      # 不会访问真实模型服务，也不产生付费调用，且失败是立即且确定性的
      # （不会像不可路由地址那样等到超时）。
      DEEPSEEK_BASE_URL: http://upstream.invalid
      OPENAI_BASE_URL: http://upstream.invalid
      DEEPSEEK_API_KEY: sk-docker-test-upstream
      OPENAI_API_KEY: sk-docker-test-upstream
      MODEL_REGISTRY: deepseek-chat:deepseek
      DEFAULT_MODEL_NAME: deepseek-chat
      UPSTREAM_TIMEOUT_SECONDS: "5"
      LOG_LEVEL: WARNING
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)\""]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  test_pgdata:
    name: modelgate-docker-test-pgdata
