# ModelGate 本地编排：FastAPI + PostgreSQL
#
# 启动：docker compose up --build
# 停止：docker compose down
# 清空数据：docker compose down -v
#
# 注意：本文件不写死任何真实密钥。
# 密钥从项目根目录的 .env 读取（可从 .env.example 复制）。

services:
  db:
    image: postgres:16-alpine
    container_name: modelgate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modelgate}
      POSTGRES_DB: ${POSTGRES_DB:-modelgate}
    ports:
      # 只绑定到宿主机回环地址，避免 PostgreSQL 被局域网/公网直接访问。
      # 本机用 DBeaver / psql 连接依然正常：
      #   psql -h 127.0.0.1 -p 5432 -U modelgate -d modelgate
      # 若要暴露给其他机器，请先修改默认密码，再显式改成 "5432:5432"。
      - "127.0.0.1:5432:5432"
    volumes:
      - modelgate_pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用容器内的 postgres 用户做真实查询，比 pg_isready 更能反映「可接受连接」
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-modelgate} -d ${POSTGRES_DB:-modelgate}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - modelgate

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modelgate-api
    restart: unless-stopped
    # 等数据库真正健康后再启动应用，避免应用启动时连不上库
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 容器内部通过服务名 db 访问数据库
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-modelgate}:${POSTGRES_PASSWORD:-modelgate}@db:5432/${POSTGRES_DB:-modelgate}
      # 模型注册表与各服务商凭证，均从 .env 透传
      MODEL_REGISTRY: ${MODEL_REGISTRY:-deepseek-chat:deepseek,deepseek-reasoner:deepseek,gpt-4o-mini:openai}
      MODEL_PRICES: ${MODEL_PRICES:-}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_PRICE_INPUT_PER_MILLION_USD: ${DEEPSEEK_PRICE_INPUT_PER_MILLION_USD:-}
      DEEPSEEK_PRICE_OUTPUT_PER_MILLION_USD: ${DEEPSEEK_PRICE_OUTPUT_PER_MILLION_USD:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PRICE_INPUT_PER_MILLION_USD: ${OPENAI_PRICE_INPUT_PER_MILLION_USD:-}
      OPENAI_PRICE_OUTPUT_PER_MILLION_USD: ${OPENAI_PRICE_OUTPUT_PER_MILLION_USD:-}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-60}
      UPSTREAM_MAX_CONNECTIONS: ${UPSTREAM_MAX_CONNECTIONS:-100}
      UPSTREAM_MAX_KEEPALIVE_CONNECTIONS: ${UPSTREAM_MAX_KEEPALIVE_CONNECTIONS:-20}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-8}
      CONCURRENCY_ACQUIRE_TIMEOUT_SECONDS: ${CONCURRENCY_ACQUIRE_TIMEOUT_SECONDS:-10}
      AGENT_TAG_MAX_LENGTH: ${AGENT_TAG_MAX_LENGTH:-64}
      # 配额（0 表示不限制）。client 按 UTC 日重置，run 覆盖整个 Run 生命周期。
      CLIENT_DAILY_REQUEST_QUOTA: ${CLIENT_DAILY_REQUEST_QUOTA:-0}
      RUN_MAX_LLM_CALLS: ${RUN_MAX_LLM_CALLS:-0}
      # 重试（1 表示不重试）。默认只对连接建立失败重试，其余需显式开启。
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-1}
      RETRY_BACKOFF_BASE_SECONDS: ${RETRY_BACKOFF_BASE_SECONDS:-0.5}
      RETRY_BACKOFF_MAX_SECONDS: ${RETRY_BACKOFF_MAX_SECONDS:-8}
      RETRY_ON_READ_TIMEOUT: ${RETRY_ON_READ_TIMEOUT:-false}
      RETRY_ON_UPSTREAM_ERROR: ${RETRY_ON_UPSTREAM_ERROR:-false}
      CLIENT_API_KEYS: ${CLIENT_API_KEYS:-sk-client-local-dev-key}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-sk-admin-local-dev-key}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # 同样只绑定宿主机回环地址。
      # 原因：默认的 CLIENT_API_KEYS / ADMIN_API_KEY 是弱占位值，
      # 如果把 8000 暴露到局域网，任何人都能拿默认 Key 调用网关并消耗你的模型额度。
      # 若要对外提供服务，请先更换所有默认凭据，再显式改成 "8000:8000"。
      - "127.0.0.1:8000:8000"
    networks:
      - modelgate

volumes:
  modelgate_pgdata:
    driver: local

networks:
  modelgate:
    driver: bridge
